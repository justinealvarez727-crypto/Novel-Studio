<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#6c5ce7"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Novel Studio">
<title>Novel Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=Crimson+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="/app.css">
</head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol><symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></symbol><symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></symbol><symbol id="i-notes" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h8"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol><symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol><symbol id="i-focus" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol><symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol><symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol><symbol id="i-pen" viewBox="0 0 24 24"><path d="m16 3 5 5L8 21H3v-5zM14 5l5 5"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l8 1M7 8l4 8M17 10l-4 6"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></symbol><symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol><symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 21H20"/></symbol><symbol id="i-road" viewBox="0 0 24 24"><path d="M5 21 9 3M19 21 15 3M12 4v3M12 11v3M12 18v3"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="i-indent" viewBox="0 0 24 24"><path d="M3 6h18M3 18h18M11 12h10M3 9l3 3-3 3"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol></svg>
<header>
<button class="ib" id="menu" aria-label="Chapters"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"/></svg></button>
<div class="tw"><span class="ib logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-pen"/></svg></span><input id="title" aria-label="Novel title" placeholder="Novel title" autocomplete="off">
<div class="pw"><button class="ib" id="nbtn" aria-label="Switch novel" aria-haspopup="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chev"/></svg></button>
<div class="pop" id="nmenu" hidden><div id="nlist"></div><div class="hr0"></div><button class="mi" id="newn">New novel</button><button class="mi danger arm" id="deln">Delete this novel</button></div></div></div>
<span id="stat" class="dot" role="status"></span>
<button class="ib" id="foc" aria-label="Focus mode" title="Focus mode (Esc to exit)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-focus"/></svg></button>
<button class="ib" id="pdf" aria-label="Export PDF" title="Export PDF"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-download"/></svg></button>
<button class="ib" id="theme" aria-label="Toggle dark mode" title="Dark / light"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-moon"/></svg></button>
</header>
<div class="wrap">
<aside id="side"><div class="sf"><div class="srch"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg><input id="flt" placeholder="Filter project files…" aria-label="Filter project files" autocomplete="off"></div><div class="pw"><button class="ib" id="addm" aria-label="Add new" aria-haspopup="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg></button><div class="pop r" id="addmenu" hidden><button class="mi" data-k="ch">New chapter</button><button class="mi" data-k="char">New character</button><button class="mi" data-k="loc">New location</button><button class="mi" data-k="lore">New lore entry</button><button class="mi" data-k="note">New note</button></div></div></div><div class="sc"><h2>Manuscript</h2><div id="list" role="list"></div><button class="add" id="addc"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>New chapter</button><div id="nav"></div></div></aside>
<main>
<div class="crumb" id="crumb"></div>
<div id="wv" style="display:flex;flex-direction:column;flex:1;min-height:0">
<div class="scroll">
<div class="arow"><label class="tick"><input type="checkbox" id="dn"><span>Finished</span></label><span style="flex:1"></span>
<button class="ib" id="bb" aria-label="Bold"><b>B</b></button><button class="ib" id="ib" aria-label="Italic"><i>I</i></button>
<div class="pw"><button class="ib aa" id="aa" aria-label="Text format" aria-haspopup="true">Aa</button>
<div class="pop fmt r" id="fmt" hidden>
<div class="pre"><button class="btn" data-pre="manuscript">Manuscript</button><button class="btn" data-pre="novel">Novel</button><button class="btn" data-pre="airy">Airy</button></div>
<div class="fr"><span>Font</span><select id="font"><option>Lora</option><option>Merriweather</option><option>Crimson Pro</option><option>Inter</option><option>Georgia</option><option>Times New Roman</option></select></div>
<div class="fr"><span>Size</span><div class="step"><button class="btn sm" id="sm" aria-label="Smaller">−</button><input type="number" id="size" min="12" max="28" aria-label="Font size"><button class="btn sm" id="sp" aria-label="Larger">+</button></div></div>
<div class="fr"><span>Line</span><div class="seg" data-for="lh"><button data-v="1.2">1.2</button><button data-v="1.5">1.5</button><button data-v="1.7">1.7</button><button data-v="2">2</button><input type="hidden" id="lh"></div></div>
<div class="fr"><span>Para gap</span><input type="range" id="ps" min="0" max="20"></div>
<div class="fr"><span>Indent</span><input type="range" id="ind" min="0" max="4" step=".5"></div>
<div class="fr"><span>Margin</span><input type="range" id="mg" min="16" max="110"></div>
<div class="fr"><span>Align</span><div class="seg" data-for="al"><button data-v="left">Left</button><button data-v="center">Center</button><button data-v="justify">Justify</button><input type="hidden" id="al"></div></div>
</div></div>
<div class="pw"><button class="ib" id="ipb" aria-label="Paragraph indent" title="Paragraph indent"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-indent"/></svg></button><div class="pop fmt r" id="ipop" hidden><div class="fr"><span>First line</span><div class="pseg" data-p="fi"><button data-v="d">Default</button><button data-v="0">None</button><button data-v="1">1.5em</button><button data-v="2">3em</button></div></div><div class="fr"><span>Left indent</span><div class="pseg" data-p="li"><button data-v="0">0</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div></div><div class="hint">Applies to the selected paragraph(s).</div></div></div>
<button class="ib" id="nb" aria-label="Chapter notes" title="Notes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-notes"/></svg></button>
<button class="ib" id="hb" aria-label="Version history" title="History"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-history"/></svg></button>
<div class="pw"><button class="ib" id="mb" aria-label="More" aria-haspopup="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-more"/></svg></button><div class="pop r" id="more" hidden><button class="mi danger arm" id="dc">Delete chapter</button></div></div>
</div>
<div class="page"><div class="eyebrow" id="eb"></div><input id="ct" placeholder="Chapter title" aria-label="Chapter title"><div id="ed" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Chapter text"></div></div>
</div></div>
<div class="pv" id="iv"></div><div class="pv" id="rv"></div><div class="pv" id="bv"></div><div class="pv" id="tv"></div>
<div class="map" id="mv"><div class="zoom"><button class="ib" id="zo" aria-label="Zoom out"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-minus"/></svg></button><button class="ib" id="zi" aria-label="Zoom in"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg></button></div><div class="cv" id="cv"><svg id="svg" viewBox="0 0 1800 1100"></svg></div><div class="pan" id="pan"></div></div>
<footer><span id="wc">0 words</span><span id="tot"></span><div class="prog" title="Goal: 2,000 words per chapter"><i id="pg"></i></div></footer>
</main></div>
<div class="np" id="np" aria-label="Chapter notes"><div class="nh"><h3>Chapter notes</h3><button class="ib" id="nc" aria-label="Close notes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg></button></div><div class="hint">Private to you. Never exported.</div><textarea id="nt" placeholder="Ideas, reminders, things to fix later…"></textarea></div>
<button class="ib" id="unfoc" aria-label="Exit focus mode" title="Exit focus mode (Esc)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg></button>
<div class="modal" id="hm" hidden role="dialog" aria-label="Version history"><div class="mbox"><div class="mh"><b>Version history</b><button class="btn" id="hs">Save version now</button><button class="ib" id="hc" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg></button></div><div id="hl"></div></div></div>
<script src="/app.js"></script>
</body></html>
